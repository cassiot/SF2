<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title Street Fighter II - CVT></title>
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        body,
        canvas {
            background-color: black;
        }

        canvas {
            width: 57%;
            object-fit: contain;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        p {
            width: 100%;
        }
    </style>
    <script type="module" src="./index.js"></script>
</head>

<body>
    <p align="center">
        <canvas width="384" height="244" align="right"></canvas>
    </p>

    <p align="left">
        <canvas width="384" height="244" align="right"></canvas>
    </p>
    <img src="../images/ken.png" alt="ken" />
    <img src="../images/ryu.png" alt="ryu" />
    <img src="../images/background.webp" alt="background" />
</body>

</html>
