<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title Street Fighter II - CVT></title>
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;

            flex-direction: column;
            --form-height: 6rem;
            --form-content-size: 2rem;
        }

        body,
        canvas {
            background-color: black;
        }

        canvas {
            width: 57%;
            object-fit: contain;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        img {
            display: none;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: var(--form-content-size);
            height: var(--form-height);
        }

        form * {
            font-size: var(--form-content-size);
        }

        input[type='checkbox'] {
            width: var(--form-content-size);
            height: var(--form-content-size);
        }

        main {
            display: flex;
            height: calc(100% -var(--form-height));
            width: 100%;
        }

        label {
            color: white;
        }

        p{
            width: 100%;
        }
    </style>
    <script type="module" src="./index.js"></script>
</head>

<body>
    <form>
        <div>
            <input id="ken" type="checkbox" name="fighter" value="Ken" />
            <label for="ken">Ken</label>
        </div>
        <div>
            <input id="ryu" type="checkbox" name="fighter" value="Ryu" />
            <label for="ryu">Ryu</label>
        </div>
        <select id="state-dropdown" name="state"></select>
        <button type="submit">Transition!</button>
    </form>
    <main>
        <p align="center">
            <canvas width="384" height="244" align="right"></canvas>
        </p>
    </main>

    <p align="left">
        <canvas width="384" height="244" align="right"></canvas>
    </p>
    <img src="../images/ken.png" alt="ken" />
    <img src="../images/ryu.png" alt="ryu" />
    <img src="../images/background.webp" alt="background" />
</body>

</html>
